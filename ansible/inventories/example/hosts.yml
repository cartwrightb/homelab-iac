---
# Non-runnable example: copy outside checkout, verify host keys and replace values.
all:
  children:
    build:
      hosts:
        build01:
          ansible_host: REPLACE_BUILD_ADDRESS
          ansible_user: REPLACE_AUTOMATION_USER
          expected_machine_id: REPLACE_CONSOLE_VERIFIED_BUILD_MACHINE_ID
    disposable:
      hosts:
        iac-disposable-01:
          ansible_host: REPLACE_GUEST_ADDRESS
          ansible_user: REPLACE_AUTOMATION_USER
          expected_machine_id: REPLACE_CONSOLE_VERIFIED_MACHINE_ID
  vars:
    ansible_ssh_private_key_file: /REPLACE_PRIVATE_DIRECTORY/automation_key
    ansible_ssh_common_args: -o UserKnownHostsFile=/REPLACE_PRIVATE_DIRECTORY/known_hosts
